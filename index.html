<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Convoy — everyone on one map</title>
<meta name="description" content="See everyone in your group on one map, with the time each person will reach the destination." />
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Convoy" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="map" aria-label="Map"></div>

<!-- Top: who you are with, and where you are all heading -->
<header id="topbar">
  <div class="card bar">
    <span id="roomChip" class="chip">—</span>
    <span id="connState" class="conn">connecting</span>
    <div class="bar-actions">
      <button id="btnInvite" class="pill accent">Invite</button>
      <button id="btnLeave" class="pill">Leave</button>
    </div>
  </div>

  <button id="destRow" class="card dest-row" aria-label="Destination">
    <span class="dest-pin" aria-hidden="true"></span>
    <span class="dest-text" id="destText">Set a destination</span>
    <span class="dest-chev" aria-hidden="true">›</span>
  </button>
</header>

<button id="btnRecenter" class="recenter" aria-label="Show everyone"></button>

<!-- Everyone, and when they arrive -->
<section id="sheet" class="card">
  <button id="sheetHead" class="sheet-head">
    <span id="peopleCount">0 people</span>
    <span class="sheet-chev" aria-hidden="true">›</span>
  </button>
  <ul id="people"></ul>
</section>

<!-- Join -->
<div id="join" class="overlay">
  <div class="card join-card">
    <div class="logo" aria-hidden="true"></div>
    <h1>Convoy</h1>
    <p class="sub">Everyone on one map, with the time each person will arrive.</p>

    <label for="inName">Your name</label>
    <input id="inName" maxlength="24" placeholder="Your name" autocomplete="name" />

    <label for="inRoom">Invite code</label>
    <input id="inRoom" maxlength="32" placeholder="Leave empty to start a new group"
           autocapitalize="none" autocorrect="off" spellcheck="false" />

    <button id="btnGo" class="primary">Start a new group</button>

    <p class="fine">Anyone with the code can join, see the map and set the destination.</p>
    <button id="btnDemo" class="linkish">Just looking? Preview with demo cars</button>
  </div>
</div>

<!-- Destination search -->
<div id="search" class="overlay hidden">
  <div class="card search-card">
    <div class="search-head">
      <input id="inSearch" placeholder="Search for a place" autocomplete="off"
             autocapitalize="none" autocorrect="off" spellcheck="false" />
      <button id="btnSearchClose" class="pill">Cancel</button>
    </div>
    <ul id="results" class="results"></ul>
    <button id="btnClearDest" class="ghost">Clear the destination</button>
  </div>
</div>

<div id="banner" class="banner" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="route.js"></script>
<script src="app.js"></script>
</body>
</html>
